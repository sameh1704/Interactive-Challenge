{% extends "teacher/base.html" %}

{% block title %}Create Question{% endblock %}

{% block content %}
  <section class="page-heading">
    <h1 class="page-heading__title">Create Question</h1>
    <p class="page-heading__subtitle">Add a new question to the bank</p>
  </section>

  <section class="panel">
    <form method="post" class="form">
      {% csrf_token %}
      <div class="field">
        <label class="field__label" for="id_text">Question text</label>
        <textarea name="text" id="id_text" rows="3" placeholder="Enter your question..." required></textarea>
      </div>
      <div class="field">
        <label class="field__label" for="id_question_type">Question type</label>
        <select name="question_type" id="id_question_type">
          {% for value, label in question_types %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="id_duration_seconds">Duration (seconds)</label>
        <input type="number" name="duration_seconds" id="id_duration_seconds" value="30" min="1" max="600">
      </div>
      <button type="submit" class="button">Create Question</button>
    </form>
  </section>
{% endblock %}
