{% extends "teacher/base.html" %}

{% block title %}Create Tournament{% endblock %}

{% block content %}
  <section class="page-heading">
    <h1 class="page-heading__title">Create Tournament</h1>
    <p class="page-heading__subtitle">Set up a new championship</p>
  </section>

  <section class="panel">
    <form method="post" class="form">
      {% csrf_token %}
      <div class="field">
        <label class="field__label" for="id_name">Name</label>
        <input type="text" name="name" id="id_name" placeholder="e.g. Spring Championship 2026" required>
      </div>
      <div class="field">
        <label class="field__label" for="id_description">Description</label>
        <textarea name="description" id="id_description" rows="3" placeholder="Optional description"></textarea>
      </div>
      <div class="field">
        <label class="field__label" for="id_subject">Subject</label>
        <input type="text" name="subject" id="id_subject" placeholder="e.g. Science">
      </div>
      <div class="field">
        <label class="field__label" for="id_grade">Grade</label>
        <input type="text" name="grade" id="id_grade" placeholder="e.g. Grade 7">
      </div>
      <div class="field">
        <label class="field__label" for="id_season">Season</label>
        <input type="text" name="season" id="id_season" placeholder="e.g. 2026" value="{{ season|default:'' }}">
      </div>
      <button type="submit" class="button">Create Tournament</button>
    </form>
  </section>
{% endblock %}
