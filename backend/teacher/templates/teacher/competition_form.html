{% extends "teacher/base.html" %}

{% block title %}Create Competition{% endblock %}

{% block content %}
  <section class="page-heading">
    <h1 class="page-heading__title">Create Competition</h1>
    <p class="page-heading__subtitle">Set up a new live round</p>
  </section>

  <section class="panel">
    <form method="post" class="form">
      {% csrf_token %}
      <div class="field">
        <label class="field__label" for="id_title">Title</label>
        <input type="text" name="title" id="id_title" placeholder="e.g. Science Lab 1 vs Science Lab 2" required>
      </div>
      <div class="field">
        <label class="field__label">Classrooms</label>
        <div style="display:flex;flex-direction:column;gap:0.5rem;">
          {% for classroom in classrooms %}
            <label style="display:flex;align-items:center;gap:0.5rem;">
              <input type="checkbox" name="classrooms" value="{{ classroom.pk }}">
              {{ classroom.display_name }}
            </label>
          {% endfor %}
        </div>
      </div>
      <button type="submit" class="button">Create Competition</button>
    </form>
  </section>
{% endblock %}
